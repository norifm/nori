[workspace]
resolver = "2"
members = ["crates/android", "crates/automix", "crates/backup", "crates/cli", "crates/core", "crates/covers", "crates/db", "crates/desktop", "crates/desktop-ui", "crates/devices", "crates/engine", "crates/host", "crates/http", "crates/ios", "crates/library", "crates/look", "crates/lyrics", "crates/model", "crates/mpris", "crates/net", "crates/output-cpal", "crates/perf", "crates/player", "crates/plugin-index", "crates/plugin-sdk", "crates/plugins", "crates/queue", "crates/remote", "crates/settings", "crates/settings-derive", "crates/sink-protocol", "crates/sign-in-window", "crates/stretch", "crates/tasks", "crates/testdir", "crates/time", "crates/transfers", "crates/uniffi-bindgen", "crates/uniffi-jni-runtime", "crates/web"]
exclude = ["vendor/i-slint-renderer-skia"]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# The Kotlin bindings go through JNI (uniffi-bindgen-kotlin-jni), which is only on uniffi's main branch so
# far. Every uniffi crate has to come from one revision, the JNI runtime included (crates/uniffi-jni-runtime
# puts the app's two Android changes over it). Without default features uniffi's macros emit no scaffolding of
# their own: crates/android generates the JNI one. A first build fetches this repository once; cargo keeps it.
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "aea52cbe269183afba665372c991420253cbe56e", default-features = false }
uniffi-bindgen-kotlin-jni = { git = "https://github.com/mozilla/uniffi-rs", rev = "aea52cbe269183afba665372c991420253cbe56e" }
uniffi-bindgen-kotlin-jni-runtime = { git = "https://github.com/mozilla/uniffi-rs", rev = "aea52cbe269183afba665372c991420253cbe56e" }

# Line tables only, none for dependencies: panics and backtraces keep their lines, while compiling,
# linking and the target directory shrink. CARGO_PROFILE_DEV_DEBUG=true brings back a debugger's variables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The time-stretch (crates/stretch) is many times slower unoptimized; keep it fast in debug builds and tests too.
[profile.dev.package.nori-stretch]
opt-level = 3

# `cargo test` only (debug builds and the APK are untouched): the sound chain, AutoMix and the decoders
# make minutes of music per test, and unoptimised they were most of the suite's time. Debug assertions
# and overflow checks stay on.
[profile.test.package.nori-player]
opt-level = 2

[profile.test.package.nori-engine]
opt-level = 2

[profile.test.package.nori-android]
opt-level = 2

[profile.test.package.nori-ios]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

# Local optimized builds (`cargo run --release`, debug APKs): fast code, rebuilt in seconds after an edit.
[profile.release]
opt-level = 3
incremental = true

# What ships (tools/release.sh: the APK, desktop packages, the iPod app): whole-program optimized, minutes
# to link.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false
# Unwind, not abort: a panic in the core reached through uniffi then comes out in Kotlin as an exception
# the caller can catch (runCatching around a measure, a page read), instead of ending the app. It costs
# unwind tables in the library, nothing per call.
panic = "unwind"
strip = true

[patch.crates-io]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }

# The web client's wasm (web/build.sh): small over fast, and a panic ends the worker (wasm has no unwinding).
# What ships is small by default: most of the code runs on a tap (pages, the database, remote control,
# lyrics, settings, the bindings), where its size costs more than its speed saves. The code the music,
# its analysis and the covers run through stays fast: the player, the engine and the stretcher,
# Android's AudioTrack writer, the decoders, the FFT and loudness, image decoding, and wasmtime's calls
# into plugins (their sound stages). The plugin compiler (Cranelift) runs only at install, so it is small too.
[profile.dist.package.nori-player]
opt-level = 3

[profile.dist.package.nori-android]
opt-level = 3

[profile.dist.package.nori-stretch]
opt-level = 3

[profile.dist.package.nori-engine]
opt-level = 3

[profile.dist.package.nori-automix]
opt-level = 3

[profile.dist.package.nori-covers]
opt-level = 3

[profile.dist.package.nori-look]
opt-level = 3

[profile.dist.package.symphonia]
opt-level = 3

[profile.dist.package.symphonia-bundle-flac]
opt-level = 3

[profile.dist.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dist.package.symphonia-codec-aac]
opt-level = 3

[profile.dist.package.symphonia-codec-alac]
opt-level = 3

[profile.dist.package.symphonia-codec-pcm]
opt-level = 3

[profile.dist.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dist.package.symphonia-common]
opt-level = 3

[profile.dist.package.symphonia-core]
opt-level = 3

[profile.dist.package.symphonia-format-isomp4]
opt-level = 3

[profile.dist.package.symphonia-format-mkv]
opt-level = 3

[profile.dist.package.symphonia-format-ogg]
opt-level = 3

[profile.dist.package.symphonia-format-riff]
opt-level = 3

[profile.dist.package.symphonia-metadata]
opt-level = 3

[profile.dist.package.opus-rs]
opt-level = 3

[profile.dist.package.rustfft]
opt-level = 3

[profile.dist.package.primal-check]
opt-level = 3

[profile.dist.package.strength_reduce]
opt-level = 3

[profile.dist.package.transpose]
opt-level = 3

[profile.dist.package.ebur128]
opt-level = 3

[profile.dist.package.image-webp]
opt-level = 3

[profile.dist.package.jpeg-decoder]
opt-level = 3

[profile.dist.package.png]
opt-level = 3

[profile.dist.package.zune-core]
opt-level = 3

[profile.dist.package.zune-jpeg]
opt-level = 3

[profile.dist.package.wasmtime]
opt-level = 3

[profile.web]
inherits = "dist"
opt-level = "s"
panic = "abort"
