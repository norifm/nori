[package]
name = "nori-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the terminal, desktop and iOS clients share around an open session: queue saves, a collection's songs, the offline index, cover colours, the output volume in dB"

[lib]
name = "nori_host"

[features]
default = ["desktop"]
# MPRIS media controls, the cpal sound card and ureq's HTTP: the terminal and desktop clients. The iOS
# and web clients leave the default features off.
desktop = ["dep:nori-mpris", "dep:mdns-sd", "dep:nori-output-cpal", "dep:nori-http", "dep:nori-plugins", "nori-core/plugins", "nori-engine/plugins", "dep:zbus", "dep:futures-lite", "dep:async-io", "dep:serde", "dep:objc2", "dep:objc2-foundation", "dep:objc2-core-foundation", "dep:objc2-io-bluetooth", "dep:objc2-core-bluetooth", "dep:dispatch2"]

[dependencies]
# Time, read the same way natively and in a browser.
nori-time = { path = "../time" }
nori-core = { path = "../core", default-features = false }
# The codecs decoded here are the client's to choose (nori-engine's `rust-codecs`).
nori-engine = { path = "../engine", default-features = false, features = ["core"] }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
nori-mpris = { path = "../mpris", optional = true }
nori-output-cpal = { path = "../output-cpal", optional = true }
nori-http = { path = "../http", optional = true }
# Nearby devices for remote control (nori-remote lan.rs); started only while it is on.
mdns-sd = { version = "0.21", optional = true, default-features = false }
nori-remote = { path = "../remote" }
# Plugins, on the desktop and terminal (desktop.rs).
nori-plugins = { path = "../plugins", optional = true }
# Where work that waits on the network runs.
nori-tasks = { path = "../tasks" }
parking_lot = "0.12"
async-trait = "0.1"

# The computer's name (device_name); an RFCOMM socket shut down (bluez.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Plugins' Bluetooth on Linux: BlueZ over the system bus, pure Rust D-Bus as the media controls use
# (bluez.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"], optional = true }
futures-lite = { version = "2.6", optional = true }
async-io = { version = "2.6", optional = true }
serde = { version = "1", optional = true }

# Plugins' Bluetooth on macOS: IOBluetooth for classic devices and RFCOMM, CoreBluetooth for GATT
# (macbt).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSUUID", "NSValue"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFRunLoop"] }
objc2-io-bluetooth = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothDevice", "IOBluetoothObject", "IOBluetoothRFCOMMChannel", "IOBluetoothSDPDataElement", "IOBluetoothSDPServiceRecord", "IOBluetoothSDPUUID", "IOBluetoothUserNotification"] }
objc2-core-bluetooth = { version = "0.3", optional = true, default-features = false, features = ["std", "dispatch2", "CBAdvertisementData", "CBAttribute", "CBCentralManager", "CBCharacteristic", "CBManager", "CBPeer", "CBPeripheral", "CBService", "CBUUID"] }
dispatch2 = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2"] }

[dev-dependencies]
# A profile of a provider without remote control, for the session's tests.
nori-core = { path = "../core", default-features = false, features = ["plugins"] }
nori-http = { path = "../http" }
nori-engine = { path = "../engine", features = ["testing"] }
nori-testdir = { path = "../testdir" }
# The test plugin, whose provider has no Subsonic server (tests/lan_jam.rs).
nori-plugins = { path = "../plugins", features = ["testing"] }
