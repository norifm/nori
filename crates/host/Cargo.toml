[package]
name = "nori-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the terminal, desktop and iOS clients share around an open session: queue saves, a collection's songs, the offline index, cover colours, the output volume in dB"

[lib]
name = "nori_host"

[features]
default = ["desktop"]
# MPRIS media controls, the cpal sound card and ureq's HTTP: the terminal and desktop clients. The iOS
# and web clients leave the default features off.
desktop = ["dep:nori-mpris", "dep:mdns-sd", "dep:nori-output-cpal", "dep:nori-http", "dep:nori-plugins", "nori-core/plugins"]

[dependencies]
# Time, read the same way natively and in a browser.
nori-time = { path = "../time" }
nori-core = { path = "../core", default-features = false }
# The codecs decoded here are the client's to choose (nori-engine's `rust-codecs`).
nori-engine = { path = "../engine", default-features = false, features = ["core"] }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
nori-mpris = { path = "../mpris", optional = true }
nori-output-cpal = { path = "../output-cpal", optional = true }
nori-http = { path = "../http", optional = true }
# Nearby devices for remote control (nori-remote lan.rs); started only while it is on.
mdns-sd = { version = "0.21", optional = true, default-features = false }
nori-remote = { path = "../remote" }
# Plugins, on the desktop and terminal (desktop.rs).
nori-plugins = { path = "../plugins", optional = true }
# Where work that waits on the network runs.
nori-tasks = { path = "../tasks" }
parking_lot = "0.12"
async-trait = "0.1"

# The computer's name (device_name).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A profile of a provider without remote control, for the session's tests.
nori-core = { path = "../core", default-features = false, features = ["plugins"] }
nori-http = { path = "../http" }
nori-engine = { path = "../engine", features = ["testing"] }
nori-testdir = { path = "../testdir" }
# The test plugin, whose provider has no Subsonic server (tests/lan_jam.rs).
nori-plugins = { path = "../plugins", features = ["testing"] }
