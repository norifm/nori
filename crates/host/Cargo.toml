[package]
name = "nori-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the terminal, desktop and iOS clients share around an open session: queue saves, a collection's songs, the offline index, cover colours, the output volume in dB"

[lib]
name = "nori_host"

[features]
default = ["desktop"]
# MPRIS media controls. The iOS client leaves the default features off.
desktop = ["dep:nori-mpris", "dep:mdns-sd"]

[dependencies]
# Time, read the same way natively and in a browser.
nori-time = { path = "../time" }
nori-core = { path = "../core", default-features = false }
# The codecs decoded here are the client's to choose (nori-engine's `rust-codecs`).
nori-engine = { path = "../engine", default-features = false, features = ["core"] }
nori-covers = { path = "../covers" }
nori-look = { path = "../look" }
nori-mpris = { path = "../mpris", optional = true }
# Nearby devices for remote control (nori-remote lan.rs); started only while it is on.
mdns-sd = { version = "0.21", optional = true, default-features = false }
nori-remote = { path = "../remote" }
# Where work that waits on the network runs.
nori-tasks = { path = "../tasks" }
parking_lot = "0.12"
async-trait = "0.1"

# The computer's name (device_name).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nori-http = { path = "../http" }
nori-engine = { path = "../engine", features = ["testing"] }
nori-testdir = { path = "../testdir" }
