[package]
name = "nori-time"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The one clock the core reads: monotonic instants and the wall clock, on every platform the web included"

[lib]
name = "nori_time"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# std's clocks panic on wasm32-unknown-unknown; there web-time reads `performance.now()` and `Date.now()`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1.1"
