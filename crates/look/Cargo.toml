[package]
name = "nori-look"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "How nori looks: the colours a page takes from its cover, shared by every platform"

[lib]
name = "nori_look"

[features]
# The uniffi exports the Android app's Kotlin bindings are generated from. A Rust client links the
# crate without them.
ffi = ["dep:uniffi"]

[dependencies]
uniffi = { workspace = true, optional = true }
