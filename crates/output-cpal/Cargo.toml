[package]
name = "nori-output-cpal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nori's desktop sound card output: nori-engine pulled by cpal (PipeWire/ALSA, CoreAudio, WASAPI)"

[lib]
name = "nori_output_cpal"

[dependencies]
nori-engine = { path = "../engine" }
cpal = "0.18"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
