# The plugin nori's tests install, built to wasm by them (src/testing.rs). Not in the workspace:
# it builds for wasm32-wasip2 only.
[package]
name = "nori-test-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Imports an interface of a newer SDK (src/unlinked.rs) that this host doesn't link: the plugin
# can't be installed.
unlinked = ["dep:wit-bindgen"]
# Headphones over Bluetooth instead (src/headphones.rs): device control and its hooks.
headphones = []

[dependencies]
nori-plugin-sdk = { path = "../../plugin-sdk" }
wit-bindgen = { version = "0.46", optional = true }

[profile.release]
opt-level = 1
panic = "abort"

[workspace]
