[package]
name = "nori-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The web client's core: nori-core and the engine in a browser's Dedicated Worker, over fetch, played through an AudioWorklet"
publish = false

# Built only for wasm32-unknown-unknown (web/build.sh); natively the library is empty.
[lib]
name = "nori_web"
crate-type = ["cdylib", "rlib"]

[features]
default = ["engine"]
# Playback: the engine and the sound chain. Off, the module is the core alone (measured for the split).
engine = ["dep:nori-engine", "dep:nori-player"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", features = ["core"], optional = true }
nori-player = { path = "../player", optional = true }
parking_lot = "0.12"
nori-time = { path = "../time" }
async-trait = "0.1"
serde_json = "1"
# The databases in the origin's private file system (rusqlite's SQLite is sqlite-wasm-rs's on wasm).
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Headers", "Request", "RequestInit", "Response", "WorkerGlobalScope", "console"] }
