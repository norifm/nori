[package]
name = "nori-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The web client's core: nori-core and the engine in a browser's Dedicated Worker, over fetch, played through an AudioWorklet"
publish = false

# Built only for wasm32-unknown-unknown (web/build.sh); natively the library is empty.
[lib]
name = "nori_web"
crate-type = ["cdylib", "rlib"]

[features]
default = ["engine"]
# The player: the shared session (nori-host), the engine and the sound chain. Off, the module is the
# core alone, which reads the library (core.wasm).
# The player with Vorbis, ALAC and Opus decoded here: for a browser whose WebCodecs lacks them.
rust-codecs = ["engine", "nori-engine/rust-codecs"]
engine = ["dep:nori-engine", "dep:nori-host", "dep:nori-player", "dep:parking_lot"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
nori-core = { path = "../core", default-features = false }
nori-engine = { path = "../engine", default-features = false, features = ["core"], optional = true }
nori-host = { path = "../host", default-features = false, optional = true }
nori-look = { path = "../look" }
nori-player = { path = "../player", optional = true }
nori-tasks = { path = "../tasks" }
parking_lot = { version = "0.12", optional = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The databases in the origin's private file system (rusqlite's SQLite is sqlite-wasm-rs's on wasm).
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult", "Request", "RequestInit", "Response", "WorkerGlobalScope", "console"] }
