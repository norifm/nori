[package]
name = "nori-core"
version.workspace = true
edition.workspace = true
# One test binary (tests/main.rs): fewer to link after an edit.
autotests = false

# The Core and Client objects, their calls into each domain crate, and the domain crates re-exported
# (nori_core::playlist, ::settings_store, ...). See AGENTS.md.

[lib]
crate-type = ["lib"]
name = "nori_core"

[[test]]
name = "core"
path = "tests/main.rs"

[features]
default = ["ffi", "plugins"]
# Plugins' providers (crates/plugins): every client but the web and the iPod.
plugins = ["dep:nori-plugins", "dep:nori-backup"]
# The optional neural beat tracker and its model download (enabled by nori-engine's `neural-beats`).
neural-beats = ["nori-player/neural-beats", "dep:sha2"]
# uniffi exports for the Kotlin bindings.
ffi = ["dep:uniffi", "nori-plugins?/ffi", "nori-backup?/ffi", "nori-model/ffi", "nori-db/ffi", "nori-net/ffi", "nori-library/ffi", "nori-automix/ffi", "nori-settings/ffi", "nori-lyrics/ffi", "nori-devices/ffi", "nori-queue/ffi", "nori-transfers/ffi", "nori-perf/ffi", "nori-remote/ffi", "nori-look/ffi"]

[dependencies]
# Time, read the same way natively and in a browser.
nori-time = { path = "../time" }
uniffi = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
parking_lot = "0.12"
# A refill's album reads side by side rather than one after another; the YouTube session's one-at-a-time rotation.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# How music is played - the sound chain and AutoMix - lives in the shared player crate.
nori-player = { path = "../player", features = ["serde"] }
nori-look = { path = "../look" }
nori-model = { path = "../model" }
nori-db = { path = "../db" }
nori-net = { path = "../net" }
nori-library = { path = "../library" }
nori-automix = { path = "../automix" }
nori-settings = { path = "../settings" }
nori-lyrics = { path = "../lyrics" }
nori-devices = { path = "../devices" }
nori-queue = { path = "../queue" }
nori-transfers = { path = "../transfers" }
nori-perf = { path = "../perf" }
nori-remote = { path = "../remote" }
# Where the remote's polls, time keeper and sends run.
nori-tasks = { path = "../tasks" }
# The plugin host, for plugins' providers.
nori-plugins = { path = "../plugins", optional = true }
# Backups of the settings and plugins, with plugins.
nori-backup = { path = "../backup", optional = true }
# The beat model's file is checked against its pinned SHA-256.
sha2 = { version = "0.11", optional = true }
# The cover loader's net forwards the async Transport trait.
async-trait = "0.1"

[dev-dependencies]
nori-player = { path = "../player", features = ["synth"] }
# A test's own directory, for a settings database.
nori-testdir = { path = "../testdir" }
# The YouTube Music provider's tests answer with the crate's own trimmed real answers.
