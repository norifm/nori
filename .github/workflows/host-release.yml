name: Desktop and CLI release
on:
  workflow_call:
    inputs:
      source:
        type: string
        default: master
      macos_on_linux:
        type: boolean
        default: false
      # A version to build as instead of the source's own (a nightly's), stamped by tools/bump-version.sh.
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source:
        description: Commit, branch, or release tag to build
        default: master
        required: true
      release:
        description: Existing release tag to attach packages to (empty builds only)
        default: ''
      macos_on_linux:
        description: Build Mac packages in Docker on Linux (Mac execution tests skipped)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
          - runner: ${{ inputs.macos_on_linux && 'ubuntu-22.04' || 'macos-15' }}
            platform: macos-aarch64
          - runner: ${{ inputs.macos_on_linux && 'ubuntu-22.04' || 'macos-15' }}
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
      - if: runner.os == 'Linux'
        uses: ./release-tooling/.github/actions/apt
        with:
          packages: libasound2-dev libasound2-plugins libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev dpkg-dev file squashfs-tools zstd flatpak librsvg2-bin imagemagick
      - name: Install Rosetta for Intel tests
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.platform == 'macos-x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          # The plugin host's tests build their fixture plugin (crates/plugins/fixture).
          rustup target add wasm32-wasip2
      - name: Stamp the version
        if: inputs.version != ''
        run: tools/bump-version.sh "${{ inputs.version }}"
      # Dependencies only; the release link (fat LTO) is never cached.
      - uses: Swatinem/rust-cache@v2
        with:
          key: host-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build, test, package and verify clients
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          flags=(--native)
          if [[ "$RUNNER_OS" == Linux && "$TARGET_PLATFORM" == macos-* ]]; then
            flags=(--allow-untested-macos)
          fi
          release-tooling/tools/host-release.sh "${flags[@]}" --workspace "$PWD" --platform "$TARGET_PLATFORM" --output build/host-release
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.platform }}
          overwrite: true
          path: build/host-release/${{ matrix.platform }}/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" packages/* --repo "$REPO" --clobber
