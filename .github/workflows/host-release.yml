name: Desktop and CLI release
on:
  workflow_call:
    inputs:
      source:
        type: string
        default: master
  workflow_dispatch:
    inputs:
      source:
        description: Commit, branch, or release tag to build
        default: master
        required: true
      release:
        description: Existing release tag to attach packages to (empty builds only)
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
          - runner: macos-15
            platform: macos-aarch64
          - runner: macos-15
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libasound2-plugins libfontconfig1-dev libfreetype6-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev dpkg-dev file squashfs-tools zstd flatpak librsvg2-bin imagemagick pulseaudio
      - name: Install Rosetta for Intel tests
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.platform == 'macos-x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build, test, package and verify clients
        run: release-tooling/tools/host-release.sh --native --workspace "$PWD" --platform "${{ matrix.platform }}" --output build/host-release
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.platform }}
          path: build/host-release/${{ matrix.platform }}/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" packages/* --repo "$REPO" --clobber
