name: Full release
on:
  workflow_dispatch:
    inputs:
      source:
        description: Commit, branch, or tag to release (version comes from the source)
        required: true
        default: master
      publish:
        description: Create the GitHub release after all packages pass
        type: boolean
        default: false
      draft:
        description: Leave the release as a draft
        type: boolean
        default: true
      macos_on_linux:
        description: Build Mac packages in Docker on Linux (Mac execution tests skipped)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # The source as one commit, so every job builds, and the tag lands on, the same one while a branch moves.
  resolve:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  hosts:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/host-release.yml
    with:
      source: ${{ needs.resolve.outputs.sha }}
      macos_on_linux: ${{ inputs.macos_on_linux }}
  # The core for each ABI on its own runner, side by side: each is a whole-program optimized build of its own.
  android-rust:
    needs: resolve
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      RUSTC_WRAPPER: ''
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release-${{ matrix.abi }}
      - uses: ./.github/actions/android-toolchain
      - run: ./gradlew :core:cargoNdkBuild -PrustTargets=${{ matrix.abi }} -PrustProfile=dist -q
      - uses: actions/upload-artifact@v7
        with:
          name: jni-${{ matrix.abi }}
          overwrite: true
          path: core/build/rust/jniLibs/
          if-no-files-found: error
  android:
    needs: [resolve, android-rust]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: source
    env:
      RUSTC_WRAPPER: ''
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
      - uses: ./release-tooling/.github/actions/release-key
        with:
          keystore: ${{ secrets.NORI_RELEASE_KEYSTORE_BASE64 }}
          properties: ${{ secrets.NORI_KEYSTORE_PROPERTIES }}
          directory: source
      - uses: ./release-tooling/.github/actions/android-toolchain
      - uses: actions/download-artifact@v8
        with:
          path: jniLibs
          pattern: jni-*
          merge-multiple: true
      - name: Build signed APK
        env:
          NORI_RELEASE_WORKSPACE: ${{ github.workspace }}/source
        run: |
          ../release-tooling/tools/with-resource.py build ../release-tooling/tools/release.sh --build --no-hosts --no-ipod --no-test --jni-libs ../jniLibs
          mkdir -p ../android-release
          cp build/release-*/*.apk build/release-*/SHA256SUMS ../android-release/
      - uses: actions/upload-artifact@v7
        with:
          name: android
          overwrite: true
          path: |
            android-release/*.apk
            android-release/SHA256SUMS
          if-no-files-found: error
  ipod:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Build iPod app
        run: |
          tools/with-resource.py build tools/ipod.sh build
          (cd build/ios && sha256sum -- *.ipa > SHA256SUMS-ipod)
      - uses: actions/upload-artifact@v7
        with:
          name: ipod
          overwrite: true
          path: |
            build/ios/*.ipa
            build/ios/SHA256SUMS-ipod
          if-no-files-found: error
  test:
    needs: resolve
    runs-on: ubuntu-26.04
    env:
      RUSTC_WRAPPER: ''
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
      - name: Test release artifact handoff
        run: python3 release-tooling/tools/test-release.py
      - uses: ./release-tooling/.github/actions/apt
        with:
          packages: ffmpeg libasound2-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          # The plugin host's tests build their fixture plugin (crates/plugins/fixture).
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test
          save-if: false
      - run: tools/with-resource.py build cargo test -j4 --workspace
  release:
    name: Assemble release
    needs: [resolve, hosts, android, ipod, test]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: source
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
      - uses: actions/download-artifact@v8
        with:
          path: source/build/workflow-release
          pattern: '{android,ipod,host-*}'
          merge-multiple: true
      - name: Verify and prepare release artifacts
        env:
          NORI_RELEASE_WORKSPACE: ${{ github.workspace }}/source
        run: ../release-tooling/tools/release.sh --build --from build/workflow-release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: source/build/workflow-release/
          if-no-files-found: error
          overwrite: true
      - name: Publish verified release artifacts
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          NORI_DRAFT: ${{ inputs.draft }}
          NORI_RELEASE_WORKSPACE: ${{ github.workspace }}/source
        run: |
          flags=()
          if [ "$NORI_DRAFT" != true ]; then flags+=(--live); fi
          ../release-tooling/tools/release.sh --publish --from build/workflow-release "${flags[@]}"
