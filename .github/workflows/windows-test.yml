name: Windows test
on:
  push:
    branches: [windows-test]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 90
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [nori-cli, nori-desktop]
    env:
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.package }}
      - run: cargo build --release --keep-going -p ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-windows-x86_64
          path: target/release/*.exe
          if-no-files-found: error
