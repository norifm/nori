name: Web image
on:
  push:
    branches: [master]
    paths:
      - web/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - app/src/main/res/font/**
      - .github/workflows/web.yml
  workflow_dispatch:
concurrency:
  group: web-image
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nori-web
  BINARYEN: version_133
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ''
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm brotli
          rustup target add wasm32-unknown-unknown
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - run: web/build.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Files only, so one build serves every platform.
      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
